# Builds web dist, syncs into Capacitor Android, assembles release APK,
# and attaches it to the GitHub Release. No WEB_APP_URL — assets are bundled.

name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach APK to (optional)'
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save-exact

      - name: Build web
        run: npm run build

      - name: Capacitor sync android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lah "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-conf-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
